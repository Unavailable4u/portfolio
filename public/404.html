<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0D12" />
    <meta name="robots" content="noindex" />
    <title>404 · This page took a wrong turn</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { --bg:#0A0D12; --text:#E8EDF2; --dim:#8A96A3; --faint:#525C68; --line:#1E242C; --cyan:#4CC9C0; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg); color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: grid; place-items: center; padding: 24px; text-align: left;
        background-image:
          linear-gradient(to right, rgb(255 255 255 / .035) 1px, transparent 1px),
          linear-gradient(to bottom, rgb(255 255 255 / .035) 1px, transparent 1px);
        background-size: 56px 56px;
      }
      main { max-width: 560px; width: 100%; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .tag { color: var(--cyan); font-size: 13px; letter-spacing: .04em; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
      .tag::before { content: ""; width: 24px; height: 1px; background: var(--cyan); }
      h1 { font-size: clamp(64px, 18vw, 120px); line-height: 1; margin: 0 0 12px; font-weight: 600; letter-spacing: -.03em; }
      h1 span { color: var(--cyan); }
      p { color: var(--dim); font-size: 18px; line-height: 1.6; margin: 0 0 32px; }
      a.btn {
        display: inline-flex; align-items: center; gap: 8px; background: var(--cyan); color: var(--bg);
        padding: 14px 24px; border-radius: 2px; font-size: 14px; font-weight: 500; text-decoration: none;
        transition: transform .2s, box-shadow .2s;
      }
      a.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgb(76 201 192 / .2); }
      a.btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
      small { display: block; margin-top: 40px; color: var(--faint); font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div class="tag mono">ERROR · PAGE NOT FOUND</div>
      <h1>4<span>0</span>4</h1>
      <p>This page took a wrong turn, unlike my code. Let's get you back to somewhere that exists.</p>
      <a class="btn mono" href="/">← Back to the portfolio</a>
      <small class="mono">If you followed a link here, I'd love to know at sayadssb@gmail.com.</small>
    </main>
  </body>
</html>
